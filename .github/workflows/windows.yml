name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Widget tests
        run: node tests/test_frontend.cjs
      - name: Panel tests
        run: node tests/test_panel.cjs
      - name: Build executable and release bundle
        run: ./build.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v7
        with:
          name: Velune-windows-x64
          path: |
            dist/Velune-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

